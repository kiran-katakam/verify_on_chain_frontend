<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="VerifyOnChain app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="512" cy="440" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".26"/>
      <stop offset=".65" stop-color="#6366f1" stop-opacity=".06"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldFill" cx="512" cy="470" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".05"/>
    </radialGradient>
    <linearGradient id="outline" x1="0" y1="200" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="check" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="inside">
      <path d="M262 256Q512 200 762 256C762 506 614 690 512 776C410 690 262 506 262 256Z"/>
    </clipPath>
    <!-- isometric chain-block hexagon, centered on 0,0 -->
    <g id="node">
      <path d="M0-78L67.5-39V39L0 78L-67.5 39V-39Z" fill="#6366f1" stroke="#6366f1" stroke-width="14" stroke-linejoin="round"/>
      <path d="M0-78L67.5-39L0 0L-67.5-39Z" fill="#fff" opacity=".3"/>
      <path d="M67.5-39V39L0 78V0Z" fill="#0a0e1a" opacity=".3"/>
    </g>
  </defs>

  <!-- base -->
  <rect width="1024" height="1024" rx="232" fill="#0a0e1a"/>
  <rect width="1024" height="1024" rx="232" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="4"/>

  <!-- shield body + soft inner glow -->
  <path d="M262 256Q512 200 762 256C762 506 614 690 512 776C410 690 262 506 262 256Z" fill="url(#shieldFill)"/>
  <g clip-path="url(#inside)">
    <path d="M262 256Q512 200 762 256C762 506 614 690 512 776C410 690 262 506 262 256Z" fill="none" stroke="#818cf8" stroke-width="70" opacity=".5" filter="url(#blur)"/>
  </g>

  <!-- outer glow + outline -->
  <path d="M262 256Q512 200 762 256C762 506 614 690 512 776C410 690 262 506 262 256Z" fill="none" stroke="#6366f1" stroke-width="44" stroke-linejoin="round" opacity=".55" filter="url(#blur)"/>
  <path d="M262 256Q512 200 762 256C762 506 614 690 512 776C410 690 262 506 262 256Z" fill="none" stroke="url(#outline)" stroke-width="30" stroke-linejoin="round"/>

  <!-- three chained hex blocks -->
  <use xlink:href="#node" x="262" y="256"/>
  <use xlink:href="#node" x="762" y="256"/>
  <use xlink:href="#node" x="512" y="776"/>

  <!-- emerald checkmark -->
  <path d="M392 486L468 562L632 388" fill="none" stroke="#10b981" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#blur)"/>
  <path d="M392 486L468 562L632 388" fill="none" stroke="url(#check)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
